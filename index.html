<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalTrail | Local Tourism Guide</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f1ea;
      color: #1f2937;
      line-height: 1.6;
    }
    h1, h3 { font-family: Georgia, serif; color: #0b3c49; }
    header {
      background: #0b3c49;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .brand { color: #fff; font: bold 24px Georgia, serif; text-decoration: none; }
    .brand span { color: #f28c28; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; }
    nav a {
      color: #e5e7eb;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    nav a:hover { color: #f28c28; }
    nav a.active { background: #f28c28; color: #0b3c49; }
    .banner {
      background: linear-gradient(120deg, #0b3c49, #1f7a8c);
      color: #fff;
      text-align: center;
      padding: 40px 20px;
    }
    .banner h2 { margin: 0 0 6px; font: 32px Georgia, serif; color: #ffd08a; }
    .banner p { margin: 0; color: #e0f2f1; }
    main {
      max-width: 1000px;
      min-height: 40vh;
      margin: 32px auto;
      padding: 0 20px;
    }
    h1 { margin-top: 0; }
    .lead { color: #6b7280; font-size: 18px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }
    .card, .info {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(11, 60, 73, 0.08);
    }
    .card { border-top: 4px solid #f28c28; }
    .card h3, .info h3 { margin-top: 0; }
    .card p { margin-bottom: 0; color: #6b7280; }
    .info { margin: 20px 0; border-left: 4px solid #f28c28; }
    .info p { margin: 6px 0; }
    .btn {
      display: inline-block;
      background: #f28c28;
      color: #0b3c49;
      padding: 11px 22px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .badge {
      display: inline-block;
      background: #0b3c49;
      color: #ffd08a;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    footer {
      background: #082a33;
      color: #cbd5e1;
      text-align: center;
      padding: 18px;
      font-size: 14px;
    }
    @media (max-width: 640px) {
      header, nav { justify-content: center; }
      .banner h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#/">Local<span>Trail</span></a>
    <nav id="navbar"></nav>
  </header>

  <section class="banner">
    <h2>Discover Tamil Nadu, One Trail at a Time</h2>
    <p>Temples, beaches, hills and heritage towns, guided by locals.</p>
  </section>

  <main id="content"></main>

  <footer>&copy; 2026 LocalTrail Tourism Guide. All rights reserved.</footer>

  <script>
    const menu = [
      ['/', 'Welcome'],
      ['/home', 'Home'],
      ['/about', 'About'],
      ['/places', 'Top Places'],
      ['/guides', 'Local Guides'],
      ['/contact', 'Contact'],
    ];

    function cards(items) {
      const html = items
        .map(([title, text]) => `<div class="card"><h3>${title}</h3><p>${text}</p></div>`)
        .join('');
      return `<div class="grid">${html}</div>`;
    }

    const pages = {
      '/': () => `
        <span class="badge">🌐 Live Preview Mode</span>
        <h1>Welcome to LocalTrail!</h1>
        <p class="lead">This is a server-side application.</p>
        <p>LocalTrail is a local tourism guide for temples, beaches, hill stations and
        heritage towns. Every page on this site is generated by a Node.js server.</p>
        <div class="info">
          <h3>Request Information</h3>
          <p><b>Request URL:</b> /</p>
          <p><b>Request Method:</b> GET</p>
          <p><b>Server Status:</b> Running (Node.js HTTP Server)</p>
        </div>
        <a class="btn" href="#/contact">Plan Your Trip</a>`,

      '/home': () => `
        <h1>Welcome to the Home Page</h1>
        <p class="lead">Travel local, travel light, travel well.</p>
        ${cards([
          ['Hand-picked Places', 'Every spot is chosen for its history, scenery or flavour.'],
          ['Local Guides', 'Walk with people who grew up in the places you visit.'],
          ['Easy Planning', 'Know the best season and time of day before you set out.'],
        ])}`,

      '/about': () => `
        <h1>About Us</h1>
        <p class="lead">LocalTrail is a tourism guide with one mission:
        to help visitors discover the real character of every town.</p>
        ${cards([
          ['Our Mission', 'Make local travel simple, safe and memorable.'],
          ['Our Values', 'Respect for culture, nature and local communities.'],
          ['Our Regions', 'Coast, plains, temple towns and the Nilgiri hills.'],
        ])}`,

      '/places': () => `
        <h1>Top Places to Visit</h1>
        <p class="lead">Six must-see destinations across Tamil Nadu.</p>
        ${cards([
          ['Meenakshi Amman Temple, Madurai', 'A temple city of tall gopurams and lively streets.'],
          ['Marina Beach, Chennai', 'A long city beach for sunrise walks and street food.'],
          ['Brihadeeswarar Temple, Thanjavur', 'A Chola-era UNESCO World Heritage temple.'],
          ['Shore Temple, Mahabalipuram', 'Ancient stone temples standing beside the sea.'],
          ['Ooty, The Nilgiris', 'Tea gardens, cool air and a toy train ride.'],
          ['Kanyakumari', 'The southern tip of India, famous for sunrise views.'],
        ])}`,

      '/guides': () => `
        <h1>Meet Our Local Guides</h1>
        <p class="lead">Friendly guides for every kind of traveller.</p>
        ${cards([
          ['M. Kavitha', 'Heritage and Temple Walks'],
          ['S. Arun', 'Hill Stations and Treks'],
          ['A. Fathima', 'Food and Market Trails'],
          ['J. Thomas', 'Coastal and Beach Tours'],
        ])}`,

      '/contact': () => `
        <h1>Contact Us</h1>
        <p class="lead">We usually reply within 24 hours.</p>
        <div class="info">
          <p><b>Address:</b> Tourist Information Centre, 12 Beach Road, Chennai - 600001</p>
          <p><b>Phone:</b> +91 98765 43210</p>
          <p><b>Email:</b> help@localtrail.in</p>
          <p><b>Hours:</b> Monday to Saturday, 9:30 AM to 6:30 PM</p>
        </div>`,
    };

    function renderNav(currentPath) {
      const nav = document.getElementById('navbar');
      nav.innerHTML = menu
        .map(([path, label]) => {
          const active = path === currentPath ? ' class="active"' : '';
          return `<a href="#${path}"${active}>${label}</a>`;
        })
        .join('');
    }

    function renderPage() {
      let hash = window.location.hash.replace(/^#/, '');
      if (!hash || hash === '') hash = '/';
      if (!hash.startsWith('/')) hash = '/' + hash;

      const renderer = pages[hash];
      const main = document.getElementById('content');

      if (renderer) {
        renderNav(hash);
        main.innerHTML = renderer();
      } else {
        renderNav('');
        main.innerHTML = `
          <h1>404 - Page Not Found</h1>
          <p class="lead">The page ${hash} does not exist on this server.</p>
          <a class="btn" href="#/">Back to Welcome Page</a>
        `;
      }
    }

    window.addEventListener('hashchange', renderPage);
    window.addEventListener('DOMContentLoaded', renderPage);
  </script>
</body>
</html>
